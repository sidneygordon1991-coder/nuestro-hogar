name: Format household cycle proposal

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 18 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/independent-budget-account-balances
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Format files
        run: npx prettier --write src/HouseholdCutoffSettings.tsx src/finance/sections/FinanceIncome.tsx src/useHouseholdPayBudget.ts src/lib/householdPayPeriod.ts src/lib/householdPayPeriod.test.ts src/lib/cashFlow.ts src/HomeMoneyWorkspace.tsx
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/HouseholdCutoffSettings.tsx src/finance/sections/FinanceIncome.tsx src/useHouseholdPayBudget.ts src/lib/householdPayPeriod.ts src/lib/householdPayPeriod.test.ts src/lib/cashFlow.ts src/HomeMoneyWorkspace.tsx
            git commit -m "style: format configurable household paycheck cycles"
            git push origin HEAD:feat/independent-budget-account-balances
          fi
