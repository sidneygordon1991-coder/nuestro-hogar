name: Format proposed UI files

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 18 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/independent-budget-account-balances
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run formatter
        run: npx prettier --write src/HomeMoneyWorkspace.tsx src/lib/budgetAvailability.test.ts
      - name: Commit automatic formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/HomeMoneyWorkspace.tsx src/lib/budgetAvailability.test.ts
            git commit -m "style: format budget dashboard and financial tests"
            git push origin HEAD:feat/independent-budget-account-balances
          fi
