name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Check formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      # Preview release gate: retain the complete regression suite in quality.yml.
      # The legacy full-home screenshot tests need redesign for the v42 Essential home.
      - name: Check production login startup in a clean browser
        run: |
          node --input-type=module <<'NODE'
          import {spawn} from 'node:child_process';
          import {chromium} from '@playwright/test';
          const url = 'http://127.0.0.1:4188/nuestro-hogar/';
          const server = spawn('npm', ['run', 'preview', '--', '--host', '127.0.0.1', '--port', '4188', '--strictPort']);
          let browser;
          try {
            let ready = false;
            for (let i = 0; i < 40; i++) {
              try {if ((await fetch(url)).ok) {ready = true; break;}} catch {}
              await new Promise(resolve => setTimeout(resolve, 500));
            }
            if (!ready) throw Error('Production preview server did not start');
            browser = await chromium.launch({headless: true});
            const context = await browser.newContext({serviceWorkers: 'block'});
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.stack || error.message));
            page.on('console', message => {if (message.type() === 'error') errors.push(message.text());});
            await page.goto(url, {waitUntil: 'domcontentloaded'});
            await page.waitForTimeout(7000);
            const body = await page.locator('body').innerText();
            console.log('Production startup text:', body.slice(0, 500));
            console.log('Errors:', JSON.stringify(errors.slice(0, 10)));
            if (!body.includes('Bienvenido a casa')) throw Error('Production login did not render: ' + body.slice(0, 500));
            console.log('Production startup verified.');
          } finally {
            if (browser) await browser.close();
            server.kill('SIGTERM');
          }
          NODE
      - name: Test core browser workflows for v42 preview
        run: >-
          npx playwright test
          tests/e2e/finance-tools.e2e.mjs
          tests/e2e/connected-finance.e2e.mjs
          tests/e2e/goal-management.e2e.mjs
          tests/e2e/resilient-experience.e2e.mjs
          tests/e2e/quick-entry.e2e.mjs
          tests/e2e/budget-progress.e2e.mjs
      - name: Save browser results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-deploy-review
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
